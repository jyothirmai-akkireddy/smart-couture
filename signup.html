{% extends "base.html" %}
{% block title %}Sign Up - StyleSense AI{% endblock %}
{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl p-8 animate-slide-in">
            <h2 class="text-3xl font-bold text-center mb-2 gradient-text">Join StyleSense</h2>
            <p class="text-center text-gray-600 mb-8">Create your account and start styling</p>
            <form id="signupForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <input type="text" name="username" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <button type="submit" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-lg">Sign Up</button>
            </form>
            <p class="mt-6 text-center text-gray-600">Already have an account? <a href="/auth/login" class="text-purple-600 hover:text-purple-700 font-semibold">Login</a></p>
        </div>
    </div>
</div>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    try {
        const response = await fetch('/auth/signup', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
        const result = await response.json();
        if (response.ok) {
            showToast('Account created!', 'success');
            setTimeout(() => window.location.href = result.redirect, 1000);
        } else {
            showToast(result.error, 'error');
        }
    } catch (error) {
        showToast('An error occurred', 'error');
    }
});
</script>
{% endblock %}

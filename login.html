{% extends "base.html" %}

{% block title %}Login - StyleSense AI{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl p-8 animate-slide-in">
            <h2 class="text-3xl font-bold text-center mb-2 gradient-text">Welcome Back</h2>
            <p class="text-center text-gray-600 mb-8">Login to your StyleSense account</p>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                
                <div class="flex items-center justify-between">
                    <a href="/auth/forgot-password" class="text-sm text-purple-600 hover:text-purple-700">Forgot Password?</a>
                </div>
                
                <button type="submit" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-lg">
                    Login
                </button>
            </form>
            
            <p class="mt-6 text-center text-gray-600">
                Don't have an account? 
                <a href="/auth/signup" class="text-purple-600 hover:text-purple-700 font-semibold">Sign Up</a>
            </p>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    
    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showToast('Login successful!', 'success');
            setTimeout(() => window.location.href = result.redirect, 1000);
        } else {
            showToast(result.error || 'Login failed', 'error');
        }
    } catch (error) {
        showToast('An error occurred', 'error');
    }
});
</script>
{% endblock %}

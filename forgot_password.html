{% extends "base.html" %}
{% block title %}Forgot Password - StyleSense AI{% endblock %}
{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
        <h2 class="text-3xl font-bold text-center mb-6 gradient-text">Reset Password</h2>
        
        <div id="emailStep">
            <form id="emailForm" class="space-y-4">
                <input type="email" name="email" placeholder="Enter your email" required
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-500">
                <button type="submit" class="w-full btn-primary text-white py-3 rounded-lg">Send OTP</button>
            </form>
        </div>
        
        <div id="otpStep" class="hidden space-y-4">
            <!-- OTP display banner will be inserted here dynamically -->
            <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6"
                   class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-500">
            <button onclick="verifyOTP()" class="w-full btn-primary text-white py-3 rounded-lg">Verify OTP</button>
        </div>
        
        <div id="passwordStep" class="hidden space-y-4">
            <input type="password" id="newPassword" placeholder="New Password" minlength="6"
                   class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-500">
            <button onclick="resetPassword()" class="w-full btn-primary text-white py-3 rounded-lg">Reset Password</button>
        </div>
    </div>
</div>

<script>
let userEmail = '';

document.getElementById('emailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    userEmail = formData.get('email');
    
    try {
        const response = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: userEmail})
        });
        const result = await response.json();
        
        if (response.ok) {
            showToast(result.message || 'OTP has been sent to your email!', 'success');
            document.getElementById('emailStep').classList.add('hidden');
            document.getElementById('otpStep').classList.remove('hidden');
        } else {
            showToast(result.error, 'error');
        }
    } catch (error) {
        showToast('Error sending OTP', 'error');
    }
});

async function verifyOTP() {
    const otp = document.getElementById('otpInput').value;
    
    if (!otp || otp.length !== 6) {
        showToast('Please enter the 6-digit OTP', 'error');
        return;
    }
    
    try {
        const response = await fetch('/auth/verify-otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: userEmail, otp})
        });
        const result = await response.json();
        
        if (response.ok) {
            showToast('OTP verified!', 'success');
            document.getElementById('otpStep').classList.add('hidden');
            document.getElementById('passwordStep').classList.remove('hidden');
        } else {
            showToast(result.error, 'error');
        }
    } catch (error) {
        showToast('Error verifying OTP', 'error');
    }
}

async function resetPassword() {
    const password = document.getElementById('newPassword').value;
    
    if (!password || password.length < 6) {
        showToast('Password must be at least 6 characters long', 'error');
        return;
    }
    
    try {
        const response = await fetch('/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: userEmail, password})
        });
        
        if (response.ok) {
            showToast('Password reset successful!', 'success');
            setTimeout(() => window.location.href = '/auth/login', 2000);
        } else {
            const result = await response.json();
            showToast(result.error || 'Error resetting password', 'error');
        }
    } catch (error) {
        showToast('An error occurred', 'error');
    }
}
</script>
{% endblock %}
